[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra"
version = "1.0.0" 
readme = "README.md"
license = "GPL-3.0-or-later"
description = "Analysis framework for SDSS-V / MWM." 
keywords = ["astronomy software"]
authors = [
  {name = "Andy Casey", email = "andrew.casey@monash.edu"},
]
maintainers = [
  {name = "Andy Casey", email = "andrew.casey@monash.edu"},
]
dependencies = [
  "numpy<2.3", # required by scipy<1.15.0
  "scipy<1.15.0", # https://github.com/scipy/scipy/issues/22325#issuecomment-2676345163
  "astropy",
  "tqdm",
  "PyYAML",
  "healpy",
  "sdssdb",
  "sdsstools",
  "specutils",
  "click",
  "matplotlib",
  "scikit-learn",
  "joblib",
  "pandas",
  "apache-airflow<3.0",
  "decorator",
  "h5py",
  "thread",
  "typer",
  "dustmaps",
  "fitsio",
  "torch==2.12.0", # cu126 build; see [tool.uv.sources] below
  "astronn",
  "sdss-semaphore",
]
#requires-python = ">= 3.9"

[classifiers]
development_status = "4 - Beta"
intended_audience = "Science/Research"
natural_language = "English"
programming_language = "Python :: 3"
topic = ["Documentation :: Sphinx", "Topic :: Software Development :: Libraries  :: Python Modules"]

[tool.setuptools.packages.find]
where = ["src/"]
include = ["astra"]

[project.scripts]
astra = "astra.cli.astra:app"
casload = "astra.cli.casload:app"
ferre_interpolate_unnormalized_model_flux = "astra.cli.post_execution_interpolation:post_execution_interpolation"

[console_scripts]
astra = "astra.cli.astra:app"
casload = "astra.cli.casload:app"
ferre_interpolate_unnormalized_model_flux = "astra.cli.post_execution_interpolation:post_execution_interpolation"

[tool.setuptools]
script-files = ["scripts/vaffoff"]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-sugar",
  "pre-commit",
  "black",
]

# The default PyPI torch wheel is built against CUDA 13, which dropped Volta
# (sm_70). The GPU nodes here are V100s, so those wheels fail at the first
# kernel launch with `cudaErrorNoKernelImageForDevice`. The cu126 wheels are the
# most recent ones still built for sm_70.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
